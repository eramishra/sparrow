name: Generate Weekly Workout Plan

on:
  schedule:
    - cron: "0 20 * * 0"  # Every Sunday at 8 PM UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  generate-plan:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed to commit plan.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate weekly plan
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run weekly-plan

      - name: Commit updated plan and history
        run: |
          git config user.name "sparrow"
          git config user.email "sparrow@users.noreply.github.com"
          git add plan.json fitness-history.json
          git diff --staged --quiet || git commit -m "chore: update weekly workout plan [skip ci]"
          git push
