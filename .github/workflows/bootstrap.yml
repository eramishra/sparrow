name: Bootstrap Fitness History (run once)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run bootstrap
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node scripts/bootstrap-history.js

      - name: Commit fitness-history.json
        run: |
          git config user.name "workout-bot"
          git config user.email "workout-bot@users.noreply.github.com"
          git add fitness-history.json
          git diff --staged --quiet || git commit -m "chore: bootstrap fitness history [skip ci]"
          git push
